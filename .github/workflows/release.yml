name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # RubyGems trusted publishing: the publisher registered on RubyGems.org
    # names this repository, release.yml, and the rubygems environment.
    environment:
      name: rubygems
      url: https://rubygems.org/gems/sudhanva
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec rake test
      - run: gem build sudhanva.gemspec
      - if: github.event_name == 'release'
        run: gh release upload "$TAG" sudhanva-*.gem --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0; the action publishes no moving major tag
      - run: gem push sudhanva-*.gem
